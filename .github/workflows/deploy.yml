name: Deploy saraha-brain
on:
  push:
    branches: [main]
    paths: ["src/**", "wrangler.toml", "package.json", ".github/workflows/**"]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Deploy with wrangler
        run: |
          ARGS="--var CF_API_TOKEN:${{ vars.CF_API_TOKEN }}"
          if [ -n "${{ vars.GITHUB_PAT }}" ]; then ARGS="$ARGS --var GITHUB_PAT:${{ vars.GITHUB_PAT }}"; fi
          if [ -n "${{ vars.ONE_KNOWLEDGE_KEY }}" ]; then ARGS="$ARGS --var ONE_KNOWLEDGE_KEY:${{ vars.ONE_KNOWLEDGE_KEY }}"; fi
          npx wrangler deploy $ARGS
        env:
          CLOUDFLARE_API_TOKEN: ${{ vars.CF_API_TOKEN }}