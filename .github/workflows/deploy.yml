name: Deploy saraha-brain
on:
  push:
    branches: [main]
    paths: ["src/**", "wrangler.toml", "package.json"]
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install
      - run: npx wrangler@3.90.0 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ vars.CF_API_TOKEN }}
